<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>sciencediscovery-bot 管理面板</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --ok: #1a7f37; --bad: #cf222e; --warn: #9a6700; --bg: #f6f8fa; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans CJK SC", sans-serif; color: var(--fg); }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .muted { color: var(--muted); }
  main { padding: 16px 20px; display: grid; gap: 16px; }
  main > * { min-width: 0; }
  [hidden] { display: none !important; }
  nav { display: flex; gap: 8px; }
  nav a { color: var(--fg); text-decoration: none; padding: 6px 10px; border-radius: 4px; }
  nav a[aria-current="page"] { background: var(--bg); box-shadow: inset 0 -2px var(--ok); }
  #events-page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  #subscriptions-page h2 { margin: 0; font-size: 18px; }
  #subscription-scope { overflow-wrap: anywhere; color: var(--muted); }
  .subscription-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; margin-top: 16px; }
  .subscription { min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 14px; overflow-wrap: anywhere; }
  .subscription header { padding: 0; border: 0; justify-content: space-between; gap: 8px; }
  .subscription h3 { font: 600 14px/1.5 ui-monospace, monospace; margin: 0; }
  .subscription p { margin: 8px 0; }
  .subscription .routes { display: flex; flex-wrap: wrap; gap: 4px; }
  .subscription code { white-space: normal; overflow-wrap: anywhere; }
  .subscription .scope { color: var(--muted); font-size: 12px; }
  #subscription-count { color: var(--muted); margin-top: 12px; }
  #subscription-search { max-width: 100%; box-sizing: border-box; }
  #usage-page h2 { margin: 0; font-size: 18px; }
  #usage-page h3 { margin: 20px 0 8px; font-size: 15px; }
  #usage-page p, #usage-page li { overflow-wrap: anywhere; }
  .usage-notes { color: var(--muted); font-size: 12px; margin: 8px 0 0; padding-left: 18px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 12px; }
  .card { min-width: 0; overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--bg); }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 20px; font-weight: 600; }
  .card .v.repositories { font-size: 13px; font-weight: 500; white-space: pre-line; }
  .card .s { font-size: 12px; color: var(--muted); }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: #fff; }
  td.title { white-space: normal; max-width: 420px; }
  code { font-size: 12px; background: var(--bg); padding: 1px 4px; border-radius: 3px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filters input, .filters select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; background: #fff; cursor: pointer; font: inherit; }
  button:hover { background: var(--bg); }
  #banner { display: none; padding: 8px 12px; border: 1px solid var(--bad); color: var(--bad); border-radius: 6px; }
  details pre { margin: 4px 0 0; font-size: 12px; white-space: pre-wrap; max-width: 80ch; }
  .table-scroll { overflow-x: auto; }
  .pager, .detail-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  button:disabled { opacity: .5; cursor: default; }
  dialog { width: min(1120px, calc(100vw - 48px)); max-height: calc(100vh - 48px); box-sizing: border-box; padding: 20px; border: 1px solid var(--line); border-radius: 8px; }
  dialog::backdrop { background: #0006; }
  .detail-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .detail-title h2 { margin: 0; font-size: 18px; }
  #detail-meta { overflow-wrap: anywhere; white-space: pre-line; }
  #detail-note { color: var(--warn); }
  .exchange { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .exchange pre { margin: 8px 0; padding: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; max-height: 48vh; font: 12px/1.6 ui-monospace, monospace; }
  .exchange h3 { font-size: 15px; margin: 8px 0; }
  @media (max-width: 700px) { .exchange { grid-template-columns: 1fr; } .exchange pre { max-height: 26vh; } dialog { padding: 14px; width: calc(100vw - 24px); } }
</style>
</head>
<body>
<header>
  <h1>sciencediscovery-bot</h1>
  <nav aria-label="管理页面"><a href="#events" data-view="events">事件记录</a><a href="#subscriptions" data-view="subscriptions">监听点</a><a href="#usage" data-view="usage">资源用量</a></nav>
  <span id="listeners" class="muted"></span>
  <span id="timezone" class="muted"></span>
  <span id="clock" class="muted"></span>
</header>
<main>
  <div id="banner" role="alert"></div>
  <div id="events-page">
  <section class="cards" id="cards"></section>
  <section>
    <div class="filters">
      <label>kind <select id="f-kind"><option value="">全部</option></select></label>
      <label>status <select id="f-status"><option value="">全部</option><option>accepted</option><option>rejected</option><option>ignored</option></select></label>
      <label>route <input id="f-route" placeholder="pull_request.merged" size="22"></label>
      <label>number <input id="f-number" size="6"></label>
      <label>limit <input id="f-limit" value="100" size="4"></label>
      <button id="reload">刷新</button>
    </div>
    <div class="table-scroll"><table>
      <thead><tr><th>时间（本地）</th><th>状态</th><th>平台</th><th>route</th><th>repo</th><th>#</th><th>标题 / 原因</th><th>监听处理</th><th>验签</th><th>delivery</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="pager">
      <button id="previous-page" disabled>上一页</button>
      <span id="page-info" aria-live="polite"></span>
      <button id="next-page" disabled>下一页</button>
    </div>
  </section>
  </div>
  <section id="subscriptions-page" aria-label="监听点" hidden>
    <h2>业务监听点</h2>
    <p id="subscription-scope"></p>
    <div class="filters">
      <label>业务 <select id="subscription-business"><option value="">全部</option></select></label>
      <label>状态 <select id="subscription-mode"><option value="">全部</option><option value="active">已启用</option><option value="noop">占位</option><option value="disabled">已停用</option></select></label>
      <label>搜索 <input id="subscription-search" type="search" placeholder="监听名称、事件或用途"></label>
      <button id="reload-subscriptions">刷新监听点</button>
    </div>
    <div id="subscription-count" role="status"></div>
    <div id="subscription-list" class="subscription-grid"></div>
  </section>
  <section id="usage-page" aria-label="资源用量" hidden>
    <h2>资源用量</h2>
    <div class="filters">
      <button id="reload-usage">刷新用量</button>
      <span id="usage-state" class="muted" role="status">随页面加载读取一次；之后点击刷新时再读取</span>
    </div>
    <div id="usage-cards" class="cards"></div>
    <h3>费用估算（不是发票）</h3>
    <p id="usage-period" class="muted"></p>
    <div class="table-scroll"><table>
      <thead><tr><th>项目</th><th class="num">本月用量</th><th class="num">每月含量</th><th class="num">超出单价</th><th class="num">估算费用</th></tr></thead>
      <tbody id="usage-estimate"></tbody>
    </table></div>
    <ul class="usage-notes" id="usage-notes"></ul>
  </section>
</main>
<dialog id="delivery-detail" aria-labelledby="detail-title">
  <div class="detail-title"><h2 id="detail-title">Webhook 投递详情</h2><button id="close-detail">关闭</button></div>
  <p id="detail-meta"></p>
  <p id="detail-note" role="status"></p>
  <div class="detail-toolbar"><label><input id="pretty-json" type="checkbox" checked> 格式化 JSON</label></div>
  <div class="exchange">
    <section><h3>请求内容</h3><details><summary>请求头（凭据已脱敏）</summary><pre id="request-headers"></pre></details><pre id="request-body"></pre></section>
    <section><h3 id="response-title">返回内容</h3><details><summary>返回头</summary><pre id="response-headers"></pre></details><pre id="response-body"></pre></section>
  </div>
</dialog>
<script>
const $ = (s) => document.querySelector(s);
const KINDS = ["ping", "issue", "issue_comment", "pull_request", "pull_request_review", "push", "installation", "workflow_run", "workflow_job", "check_run", "check_suite", "status", "release", "create", "delete", "unknown"];
for (const k of KINDS) $("#f-kind").append(new Option(k, k));
const cloudAdmin = location.pathname === "/admin" || location.pathname.startsWith("/admin/");
const apiBase = cloudAdmin ? "/admin" : "";
const token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
// Fragments are not sent over HTTP. Keep the token in memory after loading.
if (token) history.replaceState(null, "", location.pathname);
const headers = token ? { Authorization: "Bearer " + token } : {};
let offset = 0, pageSize = 100, listRequest = 0, detailRequest = 0, currentDetail = null;
let subscriptions = [], refreshRequest = 0;
let usageRequest = 0;
const currentView = () => location.hash === "#subscriptions" ? "subscriptions" : location.hash === "#usage" ? "usage" : "events";
function selectView() {
  const view = currentView();
  $("#events-page").hidden = view !== "events";
  $("#subscriptions-page").hidden = view !== "subscriptions";
  $("#usage-page").hidden = view !== "usage";
  for (const link of document.querySelectorAll("[data-view]")) {
    if (link.dataset.view === view) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  }
}
function renderSubscriptions() {
  const business = $("#subscription-business").value, mode = $("#subscription-mode").value;
  const query = $("#subscription-search").value.trim().toLowerCase();
  const visible = subscriptions.filter(s => (!business || s.business === business) && (!mode || s.mode === mode)
    && (!query || [s.id, s.description, s.business, ...s.routes].join(" ").toLowerCase().includes(query)));
  $("#subscription-count").textContent = `显示 ${visible.length} / ${subscriptions.length} 个监听点`;
  $("#subscription-list").innerHTML = visible.map(s => `<article class="subscription">
    <header><h3>${esc(s.id)}</h3><span class="${s.mode === 'active' ? 'ok' : s.mode === 'noop' ? 'warn' : ''}">${esc({active:'已启用',noop:'占位',disabled:'已停用'}[s.mode] || s.mode)}</span></header>
    <p><strong>${esc(s.business)}</strong> · ${esc(s.description)}</p>
    <div class="routes">${s.routes.map(route => `<code>${esc(route)}</code>`).join('')}</div>
    ${s.exclude.length ? `<p class="scope">排除：${esc(s.exclude.join('、'))}</p>` : ''}
    <p class="scope">平台：${esc(s.providers.join('、') || '遵循接入范围')}<br>仓库：${esc(s.repositories.join('、') || '遵循全局跟踪范围')}</p>
  </article>`).join('') || '<p>没有匹配的监听点</p>';
}
async function loadSubscriptions() {
  const doc = await api("/api/listeners");
  subscriptions = doc.listeners;
  $("#subscription-scope").textContent = "跟踪仓库：" + (doc.repositories.join("、") || "由接入配置决定") + "。通过验签、仓库范围检查和去重后执行；其他投递仍保留在事件记录中。";
  const filter = $("#subscription-business"), selected = filter.value;
  filter.replaceChildren(new Option("全部", ""), ...[...new Set(subscriptions.map(s => s.business))].map(name => new Option(name, name)));
  if ([...filter.options].some(o => o.value === selected)) filter.value = selected;
  renderSubscriptions();
}
const eventTimeFormat = new Intl.DateTimeFormat("zh-CN", {
  year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
});
$("#timezone").textContent = "时间显示：" + eventTimeFormat.resolvedOptions().timeZone;

function eventTime(value) {
  if (!value) return "—";
  // Stored offsets use +0000; normalize to the ISO +00:00 spelling for browsers.
  const iso = String(value).replace(/([+-]\d{2})(\d{2})$/, "$1:$2");
  if (!/(Z|[+-]\d{2}:\d{2})$/i.test(iso)) return String(value);
  const date = new Date(iso);
  return Number.isNaN(date.getTime()) ? String(value) : eventTimeFormat.format(date);
}

async function api(path, opts = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  try {
    const r = await fetch(apiBase + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) }, signal: ctrl.signal, cache: "no-store" });
    const doc = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(doc.error || ("HTTP " + r.status));
    return doc;
  } finally { clearTimeout(timer); }
}

function card(k, v, s, cls) { return `<div class="card"><div class="k">${esc(k)}</div><div class="v ${cls || ""}">${esc(v)}</div><div class="s">${esc(s)}</div></div>`; }

async function loadStatus() {
  const st = await api("/api/status");
  const c = st.config, counts = st.counts;
  $("#listeners").textContent = st.runtime === "cloudflare" ? `${st.environment} · 云端记录 · 只读 · v${st.version}` : `webhook ${c.webhook.host}:${c.webhook.port} · admin ${c.admin.host}:${c.admin.port}${c.admin.token_required ? " (token)" : ""} · v${st.version}`;
  const secretCards = Object.entries(c.providers).map(([p, v]) =>
    card(p + " 密钥", v.secret_configured ? "已配置" : "未配置", v.secret_configured ? "HMAC 验签开启" : v.signature_required ? "未启用此平台接入" : "接受未签名投递", v.secret_configured ? "ok" : "bad")).join("");
  const routes = Object.entries(counts.by_route || {}).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([r, n]) => `${r} ${n}`).join(" · ");
  $("#cards").innerHTML = secretCards
    + card("accepted", counts.accepted, routes, "ok")
    + card("rejected", counts.rejected, "验签失败 / 坏请求", counts.rejected ? "bad" : "")
    + card("ignored / duplicate", `${counts.ignored} / ${counts.duplicate}`, "不在 SDBOT_REPOS / 平台重投", "")
    + card("跟踪仓库", c.repos.length ? c.repos.join("\n") : "全部", "SDBOT_REPOS", "repositories")
    + card("投递留存", "全部记录", `请求正文上限 ${Math.round(c.payload_max_bytes / 1024 / 1024)} MB；超限标记不完整`, "");
  if (st.board?.enabled) {
    for (const b of st.board.targets || [st.board]) {
      const actions = b.execution === 'github_actions';
      $("#cards").innerHTML += card("静态看板", b.running ? (actions ? "触发采集中" : "发布中") : b.pending ? "等待更新" : actions ? (b.last_dispatch ? "已触发采集" : "等待首次采集") : b.last_success ? "已提交发布" : "等待首次发布",
        `${b.source || ''} → ${b.repository} · ${actions ? '最近触发' : '最近成功'} ${eventTime(actions ? b.last_dispatch : b.last_success)}${b.error ? " · 重试中：" + b.error : ""}`, b.error ? "warn" : "ok");
    }
  }
}

const bytes = (n) => n == null ? "—" : n < 1000 ? n + " B" : n < 1e6 ? (n / 1e3).toFixed(1) + " KB" : n < 1e9 ? (n / 1e6).toFixed(1) + " MB" : (n / 1e9).toFixed(2) + " GB";
const count = (n) => n == null ? "—" : Number(n).toLocaleString("zh-CN");
// Storage lines are GB-month; show them as sizes so small databases do not read as zero.
const amount = (line, n) => line.per === "GB-month" ? bytes(Math.round(n * 1e9)) : count(Math.round(n * 1000) / 1000);
const usd = (n) => n == null ? "—" : "$" + Number(n).toFixed(2);
function renderUsage(doc) {
  const a = doc.analytics || {}, r2 = a.r2 || {}, d = a.durable_objects || {}, p = doc.pricing, c = doc.archive.counts || {};
  const measured = a.status === "ok" || a.status === "partial";
  const free = p.durable_objects.free_daily, today = d.today;
  const share = (used, limit) => used == null ? "" : `（${(used / limit * 100).toFixed(1)}%）`;
  $("#usage-cards").innerHTML = card("SQLite 数据库", bytes(doc.database.bytes), doc.database.bytes == null ? "本机运行没有 databaseSize" : "SqlStorage.databaseSize，本对象当前大小", "")
    + card("投递计数", count(c.accepted), `rejected ${count(c.rejected)} · ignored ${count(c.ignored)} · duplicate ${count(c.duplicate)}`, "")
    + card("去重窗口", count(doc.archive.remembered_deliveries), "counters 中的 seen 计数", "")
    + (measured ? card("R2 存储", bytes(r2.storage_bytes), r2.object_count == null ? "读取失败" : `${count(r2.object_count)} 个对象 · 采样 ${eventTime(r2.sampled_at)}`, "")
      + card("R2 操作（本月）", `A ${count(r2.class_a)} / B ${count(r2.class_b)}`, `免费操作 ${count(r2.free)}${Object.keys(r2.unclassified || {}).length ? " · 未归类 " + Object.entries(r2.unclassified).map(([k, v]) => k + " " + v).join("、") : ""}`, "")
      + card("Durable Object 行读 / 行写（本月）", `${count(d.rows_read)} / ${count(d.rows_written)}`, `请求 ${count(d.requests)} · 时长 ${count(d.duration_gb_s)} GB-s`, "")
      + card("今日（UTC）行读 / 行写", today ? `${count(today.rows_read)} / ${count(today.rows_written)}` : "—",
        today ? `Free 计划每日上限 ${count(free.rows_read)} / ${count(free.rows_written)}：读${share(today.rows_read, free.rows_read)} 写${share(today.rows_written, free.rows_written)}` : "读取失败",
        today && (today.rows_read > free.rows_read * .8 || today.rows_written > free.rows_written * .8) ? "warn" : "")
      : card("云端计量", a.status === "unavailable" ? "不可用" : "未读取", a.message || "", "warn"));
  const errors = Object.entries(a.errors || {}).map(([k, v]) => `${k}：${v}`).join("；");
  $("#usage-period").textContent = measured
    ? `操作量为 ${a.period.start} 起本自然月（UTC）至 ${eventTime(a.period.end)} 的累计；存储按当前大小持续一个月计算。云端计量读取于 ${eventTime(a.fetched_at)}，6 小时内复用，${eventTime(a.next_fetch_at)} 后打开或刷新才会重新查询。${errors ? "部分数据读取失败：" + errors : ""}`
    : "";
  $("#usage-estimate").innerHTML = measured
    ? doc.estimate.lines.map(l => `<tr><td>${esc(l.item)}</td><td class="num">${esc(l.used == null ? "读取失败" : amount(l, l.used))}</td><td class="num">${esc(amount(l, l.included))}</td><td class="num">${esc("$" + l.unit_price + " / " + l.per)}</td><td class="num">${esc(usd(l.cost))}</td></tr>`).join("")
      + `<tr><td><strong>合计（Paid 计划超出部分）</strong></td><td></td><td></td><td></td><td class="num"><strong>${esc(doc.estimate.total == null ? "部分未知" : usd(doc.estimate.total))}</strong></td></tr>`
    : `<tr><td colspan="5" class="warn">${esc(a.message || "云端计量不可用，不能估算操作量")}</td></tr>`;
  $("#usage-notes").innerHTML = [
    "估算，不是发票：只按公开单价计算超出每月含量的部分，不含套餐月费；账单周期、四舍五入和同账号其他 Worker 的用量都可能使实际金额不同。",
    `单价来源：<a href="${esc(p.durable_objects.source)}" target="_blank" rel="noopener">Durable Objects pricing</a>（${esc(p.durable_objects.as_of)}）、<a href="${esc(p.r2.source)}" target="_blank" rel="noopener">R2 pricing</a>（${esc(p.r2.as_of)}，${esc(p.r2.storage_class)}）。`,
    `未查询账号套餐。若为 Free 计划：Durable Objects 不按量计费，但每天 ${free.rows_read / 1e4} 万行读、${free.rows_written / 1e4} 万行写，用尽后存储调用失败，Webhook、令牌兑换和健康检查都返回 503，每天 00:00 UTC 重置。若为 Paid 计划：按上表含量与单价估算。`,
    "R2 每月含 10 GB 存储、100 万次 Class A、1000 万次 Class B，与 Workers 套餐无关。",
    "本页只读维护好的计数和数据库大小，不扫描投递记录，也不列举或读取 R2 对象。",
  ].map(text => `<li>${text}</li>`).join("");
}
async function loadUsage() {
  const requestId = ++usageRequest;
  $("#usage-state").textContent = "正在读取…";
  try {
    const doc = await api("/api/usage");
    if (requestId !== usageRequest) return;
    renderUsage(doc);
    $("#usage-state").textContent = "读取于 " + new Date().toLocaleTimeString() + "；点击刷新时再读取";
  } catch (err) {
    if (requestId !== usageRequest) return;
    $("#usage-state").textContent = "读取失败：" + err.message + "；点击「刷新用量」重试";
  }
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

async function loadEvents() {
  const requestId = ++listRequest;
  const q = new URLSearchParams();
  for (const [k, id] of [["kind", "#f-kind"], ["status", "#f-status"], ["route", "#f-route"], ["number", "#f-number"], ["limit", "#f-limit"]]) {
    const v = $(id).value.trim(); if (v) q.set(k, v);
  }
  q.set("offset", offset);
  const doc = await api("/api/events?" + q.toString());
  if (requestId !== listRequest) return;
  pageSize = Math.max(1, Math.min(Number(q.get("limit")) || 50, 500));
  $("#previous-page").disabled = offset === 0;
  $("#next-page").disabled = !doc.has_more;
  $("#page-info").textContent = doc.count ? `第 ${offset + 1}–${offset + doc.count} 条` : "没有匹配的事件";
  $("#rows").innerHTML = doc.events.map((e) => {
    const cls = e.status === "accepted" ? (e.duplicate ? "warn" : "ok") : "bad";
    const title = e.status === "rejected" ? `${esc(e.reason)} (HTTP ${e.http_status})` : esc(e.title || e.note || "");
    const hooks = esc(e.listeners?.length ? e.listeners.map(l => `${l.id} (${l.status})`).join(", ") : (e.hooks || []).join(", ")) + ((e.errors || []).length ? ` <span class="bad">errors ${e.errors.length}</span>` : "");
    const link = /^https?:\/\//i.test(e.url || "") ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.number ?? "")}</a>` : esc(e.number ?? "");
    const id = e.record_id || e.delivery_id;
    const detail = `<button data-id="${esc(id)}" class="detail">查看详情</button>`;
    return `<tr><td title="${esc(e.received_at || "")}">${esc(eventTime(e.received_at))}</td><td class="${cls}">${esc(e.status)}${e.duplicate ? " (dup)" : ""}</td>`
      + `<td>${esc(e.provider)}</td><td><code>${esc(e.route)}</code></td><td>${esc(e.repo)}</td><td>${link}</td><td class="title">${title}</td>`
      + `<td>${hooks}</td><td>${esc(e.verification || "")}</td><td><code>${esc((e.delivery_id || "").slice(0, 18))}</code></td><td>${detail}</td></tr>`;
  }).join("") || `<tr><td colspan="11" class="muted">没有匹配的事件</td></tr>`;
}

function renderBodies() {
  if (!currentDetail) return;
  const format = (text) => {
    if (text == null) return "未保存";
    if ($("#pretty-json").checked) { try { return JSON.stringify(JSON.parse(text), null, 2); } catch {} }
    return text;
  };
  $("#request-body").textContent = format(currentDetail.request.body);
  $("#response-body").textContent = format(currentDetail.response?.body);
}

async function openDetail(id) {
  const requestId = ++detailRequest;
  currentDetail = null;
  $("#detail-meta").textContent = "正在加载…";
  $("#detail-meta").title = "";
  $("#detail-note").textContent = "";
  $("#response-title").textContent = "返回内容";
  for (const key of ["request-body", "response-body", "request-headers", "response-headers"]) $("#" + key).textContent = "";
  $("#delivery-detail").showModal();
  try {
    const doc = await api("/api/events/" + encodeURIComponent(id));
    if (requestId !== detailRequest) return;
    currentDetail = doc;
    const r = doc.record, req = doc.request, res = doc.response;
    $("#detail-meta").textContent = `${eventTime(r.received_at)} · ${req.method || "未知方法"} ${req.path || "历史路径未保存"}\n投递 ${r.delivery_id || "无平台 ID"} · 记录 ${r.record_id}`;
    $("#detail-meta").title = r.received_at || "";
    const notes = [];
    if (doc.legacy) notes.push("历史记录未保存请求头和返回内容；已有的请求正文仍可查看。");
    if (!req.body_available) notes.push("请求正文未保存或文件已不可用。");
    if (req.body_complete === false) notes.push(`请求正文不完整：${req.capture_note || "未完整接收"}；已保存 ${req.body_bytes} 字节。`);
    if (req.body_encoding === "base64") notes.push("请求不是 UTF-8 文本，以下以 Base64 显示原始字节。");
    if (req.source === "replay") notes.push("这是管理重放产生的新记录，返回内容为处理管道结果。");
    $("#detail-note").textContent = notes.join(" ");
    $("#response-title").textContent = res ? `返回内容 · HTTP ${res.status}` : "返回内容 · 历史记录未保存";
    $("#request-headers").textContent = req.headers ? JSON.stringify(req.headers, null, 2) : "历史记录未保存";
    $("#response-headers").textContent = res ? JSON.stringify(res.headers, null, 2) : "历史记录未保存";
    renderBodies();
  } catch (err) {
    if (requestId === detailRequest) $("#detail-meta").textContent = "加载失败：" + err.message;
  }
}

$("#close-detail").addEventListener("click", () => $("#delivery-detail").close());
$("#delivery-detail").addEventListener("close", () => { ++detailRequest; currentDetail = null; });
$("#pretty-json").addEventListener("change", renderBodies);
document.addEventListener("click", (ev) => {
  const btn = ev.target.closest("button.detail");
  if (btn) openDetail(btn.dataset.id);
});

async function refresh() {
  const requestId = ++refreshRequest;
  try {
    const view = currentView();
    await Promise.all([loadStatus(), view === "subscriptions" ? loadSubscriptions() : view === "events" ? loadEvents() : null]);
    if (requestId !== refreshRequest) return;
    $("#banner").style.display = "none";
    $("#clock").textContent = "更新于 " + new Date().toLocaleTimeString();
  } catch (err) {
    if (requestId !== refreshRequest) return;
    $("#banner").textContent = "读取失败：" + err.message + (cloudAdmin ? "（登录可能已过期，请刷新页面重新登录）" : token ? "" : "（若设置了 SDBOT_ADMIN_TOKEN，在地址后加 #token=…）");
    $("#banner").style.display = "block";
  }
}

// Data is read when the page loads and when someone asks for it; nothing polls.
// Refresh buttons reload the status, the current list and the usage section together.
const reloadAll = () => { refresh(); loadUsage(); };
for (const id of ["#reload", "#reload-subscriptions", "#reload-usage"]) $(id).addEventListener("click", reloadAll);
for (const id of ["#subscription-business", "#subscription-mode"]) $(id).addEventListener("change", renderSubscriptions);
$("#subscription-search").addEventListener("input", renderSubscriptions);
// Usage was read with the page; opening its view reads nothing new.
window.addEventListener("hashchange", () => { selectView(); if (currentView() !== "usage") refresh(); });
for (const id of ["#f-kind", "#f-status", "#f-route", "#f-number", "#f-limit"]) $(id).addEventListener("change", () => { offset = 0; refresh(); });
$("#previous-page").addEventListener("click", () => { offset = Math.max(0, offset - pageSize); refresh(); });
$("#next-page").addEventListener("click", () => { offset += pageSize; refresh(); });
selectView();
reloadAll();
</script>
</body>
</html>
